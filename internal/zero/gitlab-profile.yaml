# Provider profile for the per-sandbox GitLab token (D20). The sandbox only
# sees a placeholder in GITLAB_TOKEN. The profile has no endpoint: where the
# token may go is in the sandbox's policy (rule "forge"), limited to the
# workspace's projects (#52, ADR 0046).
id: zero-gitlab-token
display_name: zero GitLab token
description: Per-sandbox fine-grained GitLab token
category: source_control
credentials:
  - name: token
    description: fine-grained project token minted by zero
    env_vars: [GITLAB_TOKEN]
    required: true
    auth_style: basic
    header_name: authorization
