# LiteLLM proxy without a database: models and key come from this file and the environment.
model_list:
  # Stand-in backend of this PoC: answers at once, used for the measurements.
  - model_name: claude-stand-in
    litellm_params:
      model: openai/stand-in
      api_base: http://backend:18101/v1
      api_key: none
  # GitHub Copilot: needs the device login once (see README), token kept in the mounted folder.
  - model_name: claude-copilot
    litellm_params:
      model: github_copilot/claude-haiku-4.5

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  telemetry: false
