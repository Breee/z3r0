name: Caveat
description: Known, documented limitation (ai-docs/caveats.md).
title: ""
labels: ["type:caveat"]
projects: ["Breee/2"]
body:
  - type: input
    id: cnum
    attributes: {label: Caveat, description: "C-number in ai-docs/caveats.md"}
    validations: {required: true}
  - type: textarea
    id: symptom
    attributes: {label: Symptom, description: "Exact behaviour, versions, impact."}
    validations: {required: true}
  - type: dropdown
    id: sev
    attributes: {label: Severity, options: [high, med, low]}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
