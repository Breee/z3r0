name: Security risk / caveat
description: "A way the agent can do damage or a weakened invariant. For accepted limits use type:caveat."
title: ""
labels: ["type:security"]
projects: ["Breee/2"]
body:
  - type: textarea
    id: path
    attributes: {label: Attack path, description: "Attacker, entry, steps, impact. Link ai-docs/attack-paths.md / caveat C-number."}
    validations: {required: true}
  - type: dropdown
    id: sev
    attributes: {label: Severity, options: [high, med, low]}
    validations: {required: true}
  - type: dropdown
    id: decision
    attributes: {label: Handling, options: [mitigate, accept (needs ADR), defer (needs phase)]}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
