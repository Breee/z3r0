name: Bug
description: zero behaves wrong.
title: ""
labels: ["type:bug"]
projects: ["Breee/2"]
body:
  - type: textarea
    id: repro
    attributes: {label: Repro, description: "Commands, actual output, expected output."}
    validations: {required: true}
  - type: input
    id: versions
    attributes: {label: Versions, description: "zero commit, openshell, podman, opencode, glab."}
    validations: {required: true}
  - type: dropdown
    id: sev
    attributes: {label: Severity, options: [high, med, low]}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
