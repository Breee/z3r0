name: Feature
description: New capability of zero.
title: ""
labels: ["type:feature"]
projects: ["Breee/2"]
body:
  - type: textarea
    id: what
    attributes: {label: What and why, description: "User-visible behaviour; link spec/ADR/requirement IDs (Z-*)."}
    validations: {required: true}
  - type: textarea
    id: good
    attributes: {label: GOOD, description: "Target behaviour / quality bar."}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: DONE, description: "Checkable exit criteria. Each one must be provable by a command + output."}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: PROOF plan, description: "Exact commands/tests that will prove DONE."}
    validations: {required: true}
