# Cluster-wide, once. Closes what RBAC cannot express.
# 1. members of zero-users may create and delete service accounts and role bindings, and create tokens,
#    only for names zero-*. Note: this also limits what they may do through their other roles.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: zero-names}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE], resources: [serviceaccounts/token]}
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, DELETE], resources: [serviceaccounts]}
      - {apiGroups: [rbac.authorization.k8s.io], apiVersions: [v1], operations: [CREATE, DELETE], resources: [rolebindings]}
  matchConditions:
    - name: zero-user
      expression: "'zero-users' in request.userInfo.groups"
  validations:
    - expression: "request.name.startsWith('zero-')"
      message: "zero-users may create and delete service accounts, tokens and role bindings only with names zero-*"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: zero-names}
spec: {policyName: zero-names, validationActions: [Deny]}
